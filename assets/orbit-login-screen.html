<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0b0d14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit-wrap {
      min-height: 620px;
      width: 100%;
      max-width: 900px;
      background: #0b0d14;
      display: flex;
      border-radius: 16px;
      overflow: hidden;
    }

    .left-panel {
      width: 45%;
      background: #0d1020;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 40px;
      position: relative;
      overflow: hidden;
    }

    .orbit-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(99,160,255,0.12);
      animation: spin linear infinite;
    }
    .orbit-ring:nth-child(1) { width: 200px; height: 200px; top: -60px; left: -60px; animation-duration: 18s; }
    .orbit-ring:nth-child(2) { width: 340px; height: 340px; top: -120px; left: -120px; animation-duration: 28s; animation-direction: reverse; }
    .orbit-ring:nth-child(3) { width: 480px; height: 480px; bottom: -200px; right: -200px; animation-duration: 40s; }
    .orbit-ring:nth-child(4) { width: 260px; height: 260px; bottom: -80px; right: -80px; animation-duration: 22s; animation-direction: reverse; }

    .orbit-dot {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #63a0ff;
      top: -3px; left: 50%;
      transform: translateX(-50%);
    }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .left-content { position: relative; z-index: 2; }

    .logo-wrap {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 40px;
    }

    .logo-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 2px solid #63a0ff;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .logo-icon::after {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #63a0ff;
      position: absolute;
    }

    .logo-name {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #e8eaf2;
      letter-spacing: 0.04em;
    }

    .tagline {
      font-size: 13px;
      color: #5a6280;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .headline {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #e8eaf2;
      line-height: 1.3;
      margin-bottom: 14px;
    }
    .headline span { color: #63a0ff; }

    .sub {
      font-size: 14px;
      color: #5a6280;
      line-height: 1.6;
      max-width: 280px;
    }

    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
      background: #0f1118;
    }

    .form-card { width: 100%; max-width: 340px; }

    .form-title {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 500;
      color: #e8eaf2;
      margin-bottom: 6px;
    }

    .form-sub {
      font-size: 13px;
      color: #5a6280;
      margin-bottom: 28px;
    }

    .field-group { margin-bottom: 16px; }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: #7a86a8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .field-input {
      width: 100%;
      background: #161825;
      border: 0.5px solid #2a2e42;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: #c8ccdc;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.15s;
    }

    .field-input:focus {
      border-color: rgba(99,160,255,0.5);
      box-shadow: 0 0 0 3px rgba(99,160,255,0.08);
    }

    .field-input::placeholder { color: #3a3f57; }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -8px;
      margin-bottom: 20px;
    }

    .forgot-link {
      font-size: 12px;
      color: #63a0ff;
      text-decoration: none;
      opacity: 0.8;
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      background: #63a0ff;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #0b0d14;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.15s, transform 0.1s;
      margin-bottom: 20px;
    }

    .btn-login:hover { opacity: 0.9; }
    .btn-login:active { transform: scale(0.98); }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .divider-line { flex: 1; height: 0.5px; background: #2a2e42; }
    .divider-text { font-size: 12px; color: #3a3f57; }

    .register-row {
      text-align: center;
      font-size: 13px;
      color: #5a6280;
    }

    .register-row a { color: #63a0ff; text-decoration: none; }

    .status-bar {
      margin-top: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #3a4060;
    }

    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #2a8a5a; }
  </style>
</head>
<body>
  <div class="orbit-wrap">
    <div class="left-panel">
      <div class="orbit-ring"><div class="orbit-dot"></div></div>
      <div class="orbit-ring"><div class="orbit-dot"></div></div>
      <div class="orbit-ring"><div class="orbit-dot"></div></div>
      <div class="orbit-ring"><div class="orbit-dot"></div></div>

      <div class="left-content">
        <div class="logo-wrap">
          <div class="logo-icon"></div>
          <span class="logo-name">Orbit</span>
        </div>
        <p class="tagline">Project Management</p>
        <h1 class="headline">Your projects.<br><span>Your orbit.</span></h1>
        <p class="sub">Track tasks, manage risks, and keep every project in alignment — all in one place.</p>
      </div>
    </div>

    <div class="right-panel">
      <div class="form-card">
        <h2 class="form-title">Welcome back</h2>
        <p class="form-sub">Sign in to your Orbit workspace</p>

        <div class="field-group">
          <label class="field-label">Email</label>
          <input class="field-input" type="email" placeholder="you@example.com" />
        </div>

        <div class="field-group">
          <label class="field-label">Password</label>
          <input class="field-input" type="password" placeholder="••••••••••" />
        </div>

        <div class="forgot-row">
          <a class="forgot-link" href="#">Forgot password?</a>
        </div>

        <button class="btn-login">Sign in to Orbit</button>

        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">new here?</span>
          <div class="divider-line"></div>
        </div>

        <div class="register-row">
          Don't have an account? <a href="#">Create one</a>
        </div>

        <div class="status-bar">
          <div class="status-dot"></div>
          All systems operational
        </div>
      </div>
    </div>
  </div>
</body>
</html>
